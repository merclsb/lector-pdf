<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lector de PDF Inteligente</title>
    <style>
        :root {
            --primary: #007bff;
            --primary-hover: #0056b3;
            --primary-light: #e6f2ff;
            --success: #28a745;
            --success-hover: #218838;
            --danger: #dc3545;
            --danger-hover: #c82333;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
        }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 15px; 
            background-color: var(--bg); 
            color: var(--text);
            box-sizing: border-box;
        }

        *, *:before, *:after { box-sizing: inherit; }

        h2 { text-align: center; margin: 10px 0; color: #2c3e50; font-size: 1.5rem; }
        h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 1.2rem; }

        /* Barra de Sesión Sincronizada */
        .session-bar {
            background: #1e293b;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .session-actions { display: flex; gap: 8px; }
        .session-input {
            padding: 6px 10px;
            border-radius: 4px;
            border: none;
            text-transform: uppercase;
            font-weight: bold;
            width: 100px;
            text-align: center;
        }
        .btn-session { background: var(--primary); padding: 6px 12px; font-size: 14px; min-height: auto; border-radius: 4px;}
        .btn-session:hover { background: var(--primary-hover); }

        .container { display: flex; flex-direction: column-reverse; gap: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; width: 100%; }
        .sidebar { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; }

        input[type="file"] { display: none; }
        .custom-file-upload { 
            border: 2px dashed var(--primary); color: var(--primary); padding: 18px; border-radius: 8px; 
            cursor: pointer; display: inline-block; width: 100%; margin-bottom: 15px; font-weight: bold; font-size: 16px;
        }
        .custom-file-upload:hover { background-color: var(--primary-light); }

        .action-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 15px 0; }
        button { color: white; border: none; padding: 14px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 5px; min-height: 48px; }
        button.play { background: var(--success); }
        button.play:hover { background: var(--success-hover); }
        button.stop { background: var(--danger); }
        button.stop:hover { background: var(--danger-hover); }

        #status { margin: 10px 0; color: #666; font-style: italic; font-size: 14px; min-height: 20px; }
        textarea { width: 100%; height: 220px; margin-top: 15px; border-radius: 8px; border: 1px solid #ccc; padding: 12px; font-family: inherit; font-size: 16px; resize: vertical; }
        
        .speed-control-wrapper { margin: 20px 0; background: #f8faf9; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .speed-label { font-weight: bold; font-size: 15px; margin-bottom: 8px; display: block; }
        .speed-actions { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .btn-speed-step { background: #e2e8f0; color: #334155; width: 42px; height: 42px; padding: 0; border-radius: 50%; font-size: 20px; min-height: 42px; }
        .btn-speed-step:hover { background: #cbd5e1; }
        input[type="range"] { flex: 1; height: 8px; cursor: pointer; accent-color: var(--primary); }
        #speedValue { font-weight: bold; min-width: 45px; font-size: 15px; text-align: right; color: #1e293b; }

        .pdf-list { list-style: none; padding: 0; margin-top: 15px; max-height: 250px; overflow-y: auto; }
        .pdf-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 8px; border-bottom: 1px solid #eee; font-size: 15px; gap: 10px; border-radius: 6px; }
        .pdf-item.active-pdf { background-color: var(--primary-light); border-left: 4px solid var(--primary); font-weight: bold; }
        .pdf-item.active-pdf .pdf-name { color: var(--primary-hover); text-decoration: none; }
        .pdf-item.read-pdf-done { background-color: #f1f5f9; opacity: 0.75; }
        .pdf-item.read-pdf-done .pdf-name { color: #64748b; text-decoration: line-through; }
        .read-checkbox { width: 20px; height: 20px; cursor: pointer; accent-color: var(--success); }
        .pdf-name { cursor: pointer; color: var(--primary); text-decoration: underline; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; padding: 6px 0; }
        .pdf-name:hover { color: var(--primary-hover); }
        .btn-delete { background: none; color: var(--danger); border: none; padding: 8px; font-size: 16px; cursor: pointer; min-height: auto; }
        .btn-delete:hover { color: #a71d2a; }

        @media (min-width: 768px) {
            h2 { font-size: 1.8rem; margin: 20px 0; }
            .container { flex-direction: row; } 
            .card { flex: 1; padding: 30px; }
            .sidebar { width: 340px; }
            .action-buttons { display: flex; justify-content: center; }
            button { width: auto; padding: 12px 28px; }
            .custom-file-upload { width: 80%; }
            .pdf-list { max-height: 400px; }
        }
    </style>
</head>
<body>

<div class="session-bar">
    <div>Dispositivo Sincronizado. Código: <span id="lblSessionCode" style="font-weight: bold; color: #38bdf8; letter-spacing: 1px;">------</span></div>
    <div class="session-actions">
        <input type="text" id="txtSessionInput" class="session-input" placeholder="CÓDIGO" maxlength="6">
        <button type="button" class="btn-session" onclick="conectarSesionExistente()">Sincronizar</button>
    </div>
</div>

<h2>📚 Lector de PDF Inteligente</h2>

<div class="container">
    <div class="sidebar">
        <h3>📁 Tus PDFs Guardados</h3>
        <ul id="listaPdfs" class="pdf-list"></ul>
    </div>

    <div class="card">
        <label class="custom-file-upload">
            <input type="file" id="pdfFile" accept=".pdf" multiple onchange="subirYActualizar()">
            📂 Subir nuevo(s) PDF(s)
        </label>
        <div id="status">Ningún archivo activo</div>
        
        <div class="speed-control-wrapper">
            <span class="speed-label">⚡ Velocidad de lectura</span>
            <div class="speed-actions">
                <button type="button" class="btn-speed-step" onclick="modificarVelocidadPaso(-0.1)">−</button>
                <input type="range" id="speedRange" min="0.5" max="2.0" step="0.1" value="1.0" oninput="ajustarVelocidad(this.value)">
                <button type="button" class="btn-speed-step" onclick="modificarVelocidadPaso(0.1)">+</button>
                <span id="speedValue">1.0x</span>
            </div>
        </div>

        <div class="action-buttons">
            <button type="button" class="play" onclick="reproducirTextoActual()">▶️ Leer</button>
            <button type="button" id="btnPausa" style="background: #ffc107; color: #212529;" onclick="alternarPausa()">⏸️ Pausar</button>
            <button type="button" class="stop" onclick="detenerLectura()">⏹️ Parar</button>
        </div>

        <textarea id="textoExtraido" placeholder="El texto del PDF seleccionado aparecerá aquí..." readonly></textarea>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
